<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#1d2a22" />
    <link rel="icon" type="image/png" href="./icones/icone-192.png" />
    <link rel="apple-touch-icon" href="./icones/icone-192.png" />
    <title>Torres do Reino (prévia)</title>
    <script type="module" crossorigin src="/torres-do-reino-previa/assets/index-5RYDQEBF.js"></script>
    <link rel="stylesheet" crossorigin href="/torres-do-reino-previa/assets/index-BOG-cy1F.css">
      <meta name="robots" content="noindex" />
    <meta name="torres-build" content="fba9108" />
  <link rel="manifest" href="/torres-do-reino-previa/manifest.webmanifest"></head>
  <body>
    <div id="jogo">
      <!-- A ordem do DOM é a ordem de foco (TL-15): mapa, cartão de contexto, Próxima onda, Pausa, Velocidade, Menu. O cartão de
           estado é texto em região nomeada, lido antes do mapa e não focável. O #painel só existe no título e no fim. -->
      <section id="hud-estado" hidden></section>
      <!-- Quadro de avisos (HV2.2-17): só texto, sem papel nem aria-live (o anúncio é do #anuncios), só visível com aviso. -->
      <p id="hud-aviso" hidden></p>
      <main id="area">
        <div id="palco" hidden>
          <canvas id="fundo" role="img"></canvas>
          <canvas id="cena" aria-hidden="true"></canvas>
          <!-- Pausa (RV-02): escurece o mapa e mostra o chip "Pausado"; só visual (o anúncio é por aria-live) e sem toque. -->
          <div id="camada-pausa" data-testid="camada-pausa" aria-hidden="true" hidden><span class="pausa-chip"></span></div>
        </div>
      </main>
      <div id="hud-cartao" hidden></div>
      <div id="hud-acoes" hidden></div>
      <section id="painel" aria-labelledby="painel-titulo"></section>
    </div>
  </body>
</html>
